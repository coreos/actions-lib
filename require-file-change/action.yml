name: Require file change
description: Fail unless a specified file or matching path is changed by a PR

inputs:
  override-label:
    description: Skip check if the PR has this label
    required: false
  path:
    description: Exact path to file (mutually exclusive with path-regex)
    required: false
  path-regex:
    description: Regular expression matching file paths (mutually exclusive with path)
    required: false
  status:
    description: Optional pull-request file status to match
    required: false
  token:
    description: Personal access token
    required: false

runs:
  using: composite
  steps:
    - name: Check for required file change
      shell: bash
      env:
        FILE_PATH: ${{ inputs.path }}
        PATH_REGEX: ${{ inputs.path-regex }}
        FILE_STATUS: ${{ inputs.status }}
        OVERRIDE_LABEL: ${{ inputs.override-label }}
        TOKEN: ${{ inputs.token || github.token }}
        PR_URL: ${{ github.event.pull_request.url }}
      run: "${{ github.action_path }}/check.sh"
